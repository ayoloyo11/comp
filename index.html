<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats Preview Card Component</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend+Deca&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="web.css">
</head>
<body>

  <main class="card">
    
    <div class="card-content">
      <h1 class="card-title">
        Get <span class="accent">insights</span> that help your business grow.
      </h1>
      
      <p class="card-description">
        Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.
      </p>

      <div class="card-stats">
        <div class="stat-item">
          <span class="stat-number">10k+</span>
          <span class="stat-label">COMPANIES</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">314</span>
          <span class="stat-label">TEMPLATES</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">12M+</span>
          <span class="stat-label">QUERIES</span>
        </div>
      </div>
    </div>

    <div class="card-image-container">
      <img src="./image-header-desktop.jpg" alt="People working in an office" class="card-image">
    </div>
  </main>

</body>
</html>
